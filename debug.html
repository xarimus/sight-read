<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Guitar Sight-Reading Trainer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #13131f;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr 220px;
      grid-template-areas:
        "header  header"
        "staff   sidebar"
        "footer  sidebar";
      height: 100vh;
      gap: 0;
    }

    /* ---- Header ---- */
    header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: #1e1e2e;
      border-bottom: 1px solid #2d2d3f;
    }

    header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.03em; }
    #status { color: #94a3b8; font-size: 13px; }
    #target-label { font-size: 22px; font-weight: 700; color: #6ee7b7; min-width: 50px; }
    #progress { color: #64748b; font-size: 12px; margin-left: auto; }

    #start-btn {
      padding: 6px 18px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    #start-btn:hover { background: #4f46e5; }
    #start-btn:disabled { background: #374151; cursor: default; }

    #stop-btn {
      padding: 6px 18px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: none;
    }
    #stop-btn:hover { background: #b91c1c; }

    /* ---- Staff ---- */
    #staff-container {
      grid-area: staff;
      background: #fff;
      align-self: center;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    aside {
      grid-area: sidebar;
      background: #1e1e2e;
      border-left: 1px solid #2d2d3f;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      overflow-y: auto;
    }

    aside h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
    }

    /* Cents needle */
    #cents-canvas {
      width: 100%;
      height: 40px;
      border-radius: 4px;
      display: block;
    }

    /* Waveform trace */
    #trace-canvas {
      width: 100%;
      height: 60px;
      border-radius: 4px;
      display: block;
    }

    /* Controls */
    .controls { display: flex; flex-direction: column; gap: 8px; }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .control-row label {
      font-size: 11px;
      color: #94a3b8;
    }

    .control-row select,
    .control-row input {
      background: #2d2d3f;
      border: 1px solid #3d3d5c;
      border-radius: 4px;
      color: #e2e8f0;
      padding: 3px 6px;
      font-size: 12px;
      width: 100%;
    }

    .control-row select:focus,
    .control-row input:focus {
      outline: none;
      border-color: #6366f1;
    }

    /* ---- Footer ---- */
    footer {
      grid-area: footer;
      padding: 6px 16px;
      background: #1e1e2e;
      border-top: 1px solid #2d2d3f;
      font-size: 11px;
      color: #475569;
    }
  </style>
</head>
<body>

  <header>
    <h1>Sight-Reading Trainer</h1>
    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>
    <span id="target-label">—</span>
    <span id="status">Press Start to begin</span>
    <span id="progress"></span>
  </header>

  <div id="staff-container"></div>

  <aside>
    <h2>Intonation</h2>
    <canvas id="cents-canvas" width="196" height="40"></canvas>

    <h2>Input</h2>
    <canvas id="trace-canvas" width="196" height="60"></canvas>

    <h2>Debug Controls</h2>
    <div id="controls-container"></div>
  </aside>

  <footer>
    Orange line = RMS noise gate. Green bar = above gate (signal active).
  </footer>

  <script type="module" src="/src/debug.js"></script>
</body>
</html>
